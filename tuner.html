<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Model Tuner — spine &amp; brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030305; --bg-2:#0a0a10; --bg-3:#101018;
    --text:#f0eff5; --text-muted:#a3a1b5; --text-dim:#7d7b96;
    --accent:#8b7cff; --accent-2:#37e6a7; --accent-3:#ff7a6b;
    --border:rgba(255,255,255,.10); --border-bright:rgba(255,255,255,.18);
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Inter',system-ui,sans-serif;
    --radius:14px;
    --spine-opacity:.85;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);overflow:hidden;
  }

  /* ---- stage ---- */
  #stage{position:fixed;inset:0;z-index:0;filter:blur(var(--bg-blur,3px))}
  #spine-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;
    transition:opacity .8s ease}
  #spine-canvas.is-ready{opacity:var(--spine-opacity,.85)}
  .grid{position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:64px 64px}

  /* ---- header ---- */
  header.bar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:1rem;
    padding:.75rem 1.15rem;
    background:rgba(3,3,5,.82);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  header.bar h1{margin:0;font-size:.86rem;font-weight:600;letter-spacing:-.01em}
  header.bar .sub{font-family:var(--mono);font-size:.68rem;color:var(--text-dim)}
  header.bar .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:.68rem;color:var(--accent-2);
    border:1px solid color-mix(in srgb,var(--accent-2) 35%,transparent);
    background:color-mix(in srgb,var(--accent-2) 10%,transparent);
    padding:.28rem .6rem;border-radius:999px}

  /* ---- scroll driver ---- */
  #scroller{position:fixed;inset:0;overflow-y:auto;z-index:10;cursor:grab}
  #scroller:active{cursor:grabbing}
  #scroll-inner{height:900vh}
  #scroller::-webkit-scrollbar{width:10px}
  #scroller::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}

  .hint{
    position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);
    z-index:15;font-family:var(--mono);font-size:.7rem;color:var(--text-dim);
    pointer-events:none;text-align:center;line-height:1.7
  }
  .hint b{color:var(--accent-2);font-weight:400}
</style>
</head>
<body>

<header class="bar">
  <h1>Model Tuner</h1>
  <span class="sub">spine &amp; brain — not part of the portfolio</span>
  <span class="spacer"></span>
  <span class="pill" id="pos">scroll 0%</span>
  <button class="pill" id="resetView" style="cursor:pointer">reset view</button>
  <a class="pill" href="index.html" style="text-decoration:none">← portfolio</a>
</header>

<div id="stage">
  <div class="grid"></div>
  <canvas id="spine-canvas"></canvas>
</div>

<div id="scroller"><div id="scroll-inner"></div></div>

<p class="hint">
  <b>drag</b> to orbit · <b>right-drag</b> to pan · <b>scroll</b> to travel the column<br>
  camera distance is on the <b>Camera distance</b> slider · <b>Copy config</b> when it looks right
</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="spine-3d.js"></script>
<script src="tune.js" defer></script>
<script>
  // The tuner page scrolls an inner element, so mirror that into the
  // page-level progress the model script reads.
  const sc = document.getElementById('scroller');
  const pos = document.getElementById('pos');
  sc.addEventListener('scroll', () => {
    const max = sc.scrollHeight - sc.clientHeight;
    const t = max > 0 ? sc.scrollTop / max : 0;
    pos.textContent = 'scroll ' + Math.round(t * 100) + '%';
    if (window.__spineSync) window.__spineSync(t, t * (window.__spine?.cfg?.spinDeg ?? 575));
  }, { passive: true });

  document.getElementById('resetView').addEventListener('click', () => {
    window.__spine?.resetView?.();
  });
</script>
</body>
</html>
